title: "Botanical Archivist"
subtitle: "Orchid Tracker Technical Documentation"
description: "Technical documentation, database schemas, and maintenance guides for Orchid Tracker."
theme: "minimal-mistakes-jekyll"
minimal_mistakes_skin: "dark" # Palette options: dark, contrast, plum, dirt

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "single"
      author_profile: true
      sidebar:
        nav: "docs"
