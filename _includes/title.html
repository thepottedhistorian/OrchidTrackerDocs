{% if site.logo %}
  <div style="display: flex; align-items: center; gap: 8px;">
    <img src="{{ site.logo | relative_url }}" alt="{{ site.title }}" style="height: 40px; width: auto;">
    <span style="font-family: Georgia, serif; color: #ffffff; font-size: 1rem;">The Potted Historian</span>
  </div>
{% else %}
  {{ site.title }}
{% endif %}
